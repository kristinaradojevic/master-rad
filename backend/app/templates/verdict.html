<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: A4;
      margin: 2.5cm 2cm;
      @bottom-center { content: counter(page); font-size: 10pt; }
    }
    body {
      /* Serif font with full Serbian Latin/Cyrillic coverage */
      font-family: "Times New Roman", "Liberation Serif", serif;
      font-size: 12pt;
      line-height: 1.5;
      color: #000;
    }
    .header { text-align: center; margin-bottom: 1.5em; }
    .case-number { text-align: right; margin-bottom: 1em; }
    .verdict-body { white-space: pre-wrap; text-align: justify; }
  </style>
</head>
<body>
  <div class="case-number">{{ input.case_number }}</div>
  <div class="header">
    <strong>{{ input.court_name }}</strong>
  </div>
  <div class="verdict-body">{{ verdict_text }}</div>
</body>
</html>
